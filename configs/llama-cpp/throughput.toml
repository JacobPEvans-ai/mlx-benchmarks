# OpenAI-compatible llama.cpp serving throughput. The campaign selects the
# endpoint and model; this recipe measures each prompt/concurrency cell only.
config_name = "llama-cpp/throughput"
engines = ["llama_cpp"]
concurrency_list = [1, 2, 4, 8]
context_list = [25, 8192, 32768, 65536, 131072]
power_cap_w = "inventory"

[[run]]
name = "serving-throughput"
executable = "gbench"
argv = [
  "--remote-endpoint", "{{ benchmark_endpoint }}",
  "--models", "{{ model_id }}",
  "--served-model-id", "{{ serving_model }}",
  "--tokenizer", "{{ model_id }}",
  "--serving-only",
  "--text-only",
  "--batch-sizes", "{{ concurrency }}",
  "--input-lengths", "{{ context }}",
  "--output-lengths", "{{ output_tokens }}",
  "--num-iterations", "1",
  "--results-dir", "{{ output_path }}",
]
dimensions = ["context_list", "concurrency_list"]
repetitions = 1
artifact_id = "selected_model"
run_on = "controller"
capture_stdout = false
converter = { executable = "mlx-bench-publish", kind = "gbench", suite = "throughput", run_on = "controller" }
output_tokens = 512
api_key_env = "OPENAI_API_KEY"
