# Machine-neutral MLX comparison recipe.
# mlx_lm.benchmark produces native diagnostic stdout, not converter input.
# The envelope run measures the selected OpenAI-compatible serving endpoint.
config_name = "mlx/cross-card"
engines = ["mlx_lm"]
concurrency_list = [1, 2, 4, 8]
context_list = [8192, 32768, 65536, 131072, 262016]
power_cap_w = "inventory"

[[run]]
name = "native-diagnostic"
executable = "python"
argv = [
  "-m", "mlx_lm.benchmark",
  "--model", "{{ artifact_path }}",
  "--prompt-tokens", "{{ context }}",
  "--generation-tokens", "{{ output_tokens }}",
  "--num-trials", "1",
]
dimensions = ["context_list"]
repetitions = 2
artifact_id = "selected_model"
run_on = "benchmark_target"
capture_stdout = true
output_tokens = 128

[[run]]
name = "serving-throughput-envelope"
executable = "gbench"
argv = [
  "--remote-endpoint", "{{ benchmark_endpoint }}",
  "--models", "{{ model_id }}",
  "--served-model-id", "{{ serving_model }}",
  "--tokenizer", "{{ model_id }}",
  "--serving-only",
  "--text-only",
  "--batch-sizes", "{{ concurrency }}",
  "--input-lengths", "{{ context }}",
  "--output-lengths", "{{ output_tokens }}",
  "--num-iterations", "1",
  "--results-dir", "{{ output_path }}",
]
dimensions = ["context_list", "concurrency_list"]
repetitions = 2
artifact_id = "selected_model"
run_on = "controller"
capture_stdout = false
converter = { executable = "mlx-bench-publish", kind = "gbench", suite = "throughput", run_on = "controller" }
output_tokens = 128
api_key_env = "OPENAI_API_KEY"
