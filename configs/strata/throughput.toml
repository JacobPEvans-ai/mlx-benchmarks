# OpenAI-compatible Strata serving throughput. Batch slots are configured on
# the target before each campaign; each row is a fixed prompt/output shape.
config_name = "strata/throughput"
engines = ["strata"]
concurrency_list = [1, 2, 4, 6, 8]
context_list = [25, 1024, 4096]
power_cap_w = "inventory"

[[run]]
name = "short-25-512-64k"
executable = "gbench"
argv = [
  "--remote-endpoint", "{{ benchmark_endpoint }}",
  "--models", "{{ model_id }}",
  "--served-model-id", "{{ serving_model }}",
  "--tokenizer", "{{ model_id }}",
  "--serving-only",
  "--text-only",
  "--batch-sizes", "{{ concurrency }}",
  "--input-lengths", "{{ context }}",
  "--output-lengths", "{{ output_tokens }}",
  "--num-iterations", "1",
  "--results-dir", "{{ output_path }}",
]
prompt_tokens = 25
dimensions = ["concurrency_list"]
repetitions = 1
artifact_id = "selected_model"
run_on = "controller"
capture_stdout = false
converter = { executable = "mlx-bench-publish", kind = "gbench", suite = "throughput", run_on = "controller" }
output_tokens = 512
api_key_env = "OPENAI_API_KEY"

