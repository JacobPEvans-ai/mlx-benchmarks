name: HF Dataset Validation

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - metadata/run-index-v1.json
      - src/mlx_benchmarks/dataset_schema.py
      - scripts/normalize_dataset_schema.py
      - scripts/validate_run_index.py
      - .github/workflows/hf-dataset-validation.yml
  pull_request:
    paths:
      - metadata/run-index-v1.json
      - src/mlx_benchmarks/dataset_schema.py
      - scripts/normalize_dataset_schema.py
      - scripts/validate_run_index.py
      - .github/workflows/hf-dataset-validation.yml

permissions:
  contents: read

jobs:
  validate-public-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install index validator
        run: python -m pip install --no-cache-dir . "huggingface-hub>=1.28.0" "pyarrow>=25.0.1"
      - name: Validate index and immutable dataset paths
        run: PYTHONPATH=src python scripts/validate_run_index.py --remote
